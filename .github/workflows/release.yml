name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.amend.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: steps.release.outputs.release_created == 'true'

      - run: bun install --frozen-lockfile
        if: steps.release.outputs.release_created == 'true'

      - name: Format release commit
        id: amend
        if: steps.release.outputs.release_created == 'true'
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          bun run format

          if git diff --quiet; then
            echo "Formatting already clean."
          else
            git add -A
            git commit --amend --no-edit
            git push --force-with-lease origin HEAD:main
            git tag -f "${{ steps.release.outputs.tag_name }}"
            git push --force origin "${{ steps.release.outputs.tag_name }}"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: npm publish --provenance
